name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare SPA fallback
        run: |
          # Azure SWA needs an index.html for SPA routing.
          # Generate a minimal shell that loads the client-side app.
          cat > .output/public/index.html << 'FALLBACK'
          <!doctype html>
          <html lang="en" data-theme="dracula">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Kitsy | Browser-Based File Tools</title>
              <meta name="description" content="Convert, edit, and process files locally in your browser with optional Google Drive sync and offline-ready PWA support." />
              <link rel="manifest" href="/manifest.json" />
              <link rel="icon" href="/favicon.ico" />
              <script>
                try {
                  var t = localStorage.getItem('Kitsy-theme') || 'dracula';
                  document.documentElement.setAttribute('data-theme', t);
                } catch (e) {}
              </script>
          FALLBACK
          # Inject all CSS and JS assets from the build
          for css in .output/public/assets/*.css; do
            [ -f "$css" ] && echo "    <link rel=\"stylesheet\" href=\"/assets/$(basename "$css")\" />" >> .output/public/index.html
          done
          echo '  </head>' >> .output/public/index.html
          echo '  <body class="min-h-screen bg-base-200 font-sans antialiased">' >> .output/public/index.html
          echo '    <div id="root"></div>' >> .output/public/index.html
          for js in .output/public/assets/client*.js; do
            [ -f "$js" ] && echo "    <script type=\"module\" src=\"/assets/$(basename "$js")\"></script>" >> .output/public/index.html
          done
          echo '  </body>' >> .output/public/index.html
          echo '</html>' >> .output/public/index.html

      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_MUD_097A06D00 }}
          action: "upload"
          app_location: ".output/public"
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
